<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VARYN: FRACTURA CERO | PANDAGANG STUDIOS</title><style>*{box-sizing:border-box}body{margin:0;background:#07050a;color:#f8f5ff;font-family:Arial,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff1c;background:#09070dcc}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#ffc642}.reader{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:20px}.book{display:flex;align-items:center;justify-content:center;gap:3px;max-width:1100px;width:100%}.page{width:min(46vw,500px);aspect-ratio:715/1105;background:#fff center/contain no-repeat;box-shadow:0 18px 55px #000;border-radius:3px}.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#0d0911e8;border:1px solid #ffffff22;border-radius:999px;padding:8px 12px;backdrop-filter:blur(12px)}button{border:0;border-radius:999px;padding:10px 16px;background:#ffc642;color:#09070b;font-weight:900;cursor:pointer}#count{min-width:85px;text-align:center;color:#d8d0df;font-size:13px}@media(max-width:700px){.book{display:block}.page{width:min(92vw,520px);margin:auto}.left{display:none}.top{font-size:12px}.controls{bottom:10px}}</style></head><body><header class="top"><div class="brand"><span>PANDAGANG STUDIOS</span> · VARYN: FRACTURA CERO</div><div>LIBRO I · 2026</div></header><main class="reader"><div class="book"><div class="page left" id="left"></div><div class="page" id="right"></div></div></main><div class="controls"><button onclick="prev()">←</button><div id="count">1 / 53</div><button onclick="next()">→</button></div><script>const total=53;let p=1;const path=n=>'pages/'+String(n).padStart(3,'0')+'.webp';function draw(){const mobile=innerWidth<=700;document.getElementById('left').style.backgroundImage=p>1&&!mobile?`url(${path(p-
